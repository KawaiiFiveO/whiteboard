<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Simple Whiteboard</title>
    <script>
        // Apply the saved (or system) theme before first paint to avoid a flash
        try { var savedTheme = localStorage.getItem('whiteboard.theme'); } catch (e) {}
        document.documentElement.dataset.theme = savedTheme ||
            (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- ===== Top bar: tool properties and actions ===== -->
    <header class="toolbar" aria-label="Tool options and actions">
        <div class="segmented" role="group" aria-label="Mode">
            <button class="seg-btn" data-mode="whiteboard" aria-pressed="true" title="Whiteboard mode">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="1.5"/><path d="M12 16v4M8 20h8"/></svg>
                <span class="seg-label">Whiteboard</span>
            </button>
            <button class="seg-btn" data-mode="storyboard" aria-pressed="false" title="Storyboard mode">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="8" height="6" rx="1"/><rect x="13" y="4" width="8" height="6" rx="1"/><rect x="3" y="14" width="8" height="6" rx="1"/><rect x="13" y="14" width="8" height="6" rx="1"/></svg>
                <span class="seg-label">Storyboard</span>
            </button>
        </div>

        <div class="divider"></div>

        <div class="group">
            <button class="icon-btn" id="colorBtn" aria-label="Color" title="Color"
                    aria-haspopup="true" aria-expanded="false" data-popover="colorPopover">
                <span class="color-dot" id="colorDot"></span>
            </button>
            <div class="size-group">
                <input type="range" id="sizeSlider" min="1" max="50" value="6" aria-label="Size" title="Size ([ and ])">
                <output id="sizeValue" for="sizeSlider">6</output>
            </div>
        </div>

        <button class="pill-btn" id="fillBtn" aria-pressed="false" title="Fill shapes (F)">
            <svg viewBox="0 0 24 24" aria-hidden="true"><rect class="filled" x="4" y="5" width="16" height="14" rx="1.5"/></svg>
            <span class="opt-label">Fill</span>
        </button>
        <button class="pill-btn" id="stabilizerBtn" aria-pressed="false" title="Stabilizer (S to toggle)"
                aria-haspopup="true" aria-expanded="false" data-popover="stabilizerPopover">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12c2.5-5 5-5 7.5 0s5 5 7.5 0c1.2-2.4 2.5-3.6 5-3.6"/></svg>
            <span class="opt-label">Stabilizer</span>
            <span class="opt-label opt-value" id="stabilizerLevel">Medium</span>
        </button>
        <!-- Text tool fonts; buttons are generated from TEXT_FONTS in script.js -->
        <div class="segmented" id="fontGroup" role="group" aria-label="Font" hidden></div>

        <div class="divider"></div>

        <div class="group">
            <button class="icon-btn" id="undoBtn" aria-label="Undo" title="Undo (Ctrl+Z, two-finger tap)" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
            </button>
            <button class="icon-btn" id="redoBtn" aria-label="Redo" title="Redo (Ctrl+Shift+Z, three-finger tap)" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
            </button>
            <button class="icon-btn" id="clearBtn" aria-label="Clear panel" title="Clear panel" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="m9.5 12.5 5 5"/><path d="m14.5 12.5-5 5"/></svg>
            </button>
        </div>

        <div class="divider"></div>

        <div class="group">
            <button class="pill-btn storyboard-only" id="canvasSizeBtn" aria-label="Canvas size" title="Canvas size"
                    aria-haspopup="true" aria-expanded="false" data-popover="canvasSizePopover">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
                <span id="canvasSizeLabel" class="size-label">1920×1080</span>
            </button>
            <button class="icon-btn" id="exportBtn" aria-label="Export" title="Export"
                    aria-haspopup="true" aria-expanded="false" data-popover="exportPopover">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
            </button>
            <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode" title="Toggle dark mode">
                <svg class="icon-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                <svg class="icon-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
            </button>
        </div>
    </header>

    <div class="workspace">
        <!-- ===== Left rail: tools ===== -->
        <nav class="toolrail" aria-label="Tools">
            <button class="icon-btn" data-tool="pen" aria-label="Pen" title="Pen (P)" aria-pressed="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
            <button class="icon-btn" data-tool="eraser" aria-label="Eraser" title="Eraser (E)" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 21-4.3-4.3a1 1 0 0 1 0-1.4l10-10a1 1 0 0 1 1.4 0l5.6 5.6a1 1 0 0 1 0 1.4L13 19"/><path d="M22 21H7"/><path d="m5 11 9 9"/></svg>
            </button>
            <div class="divider"></div>
            <button class="icon-btn" data-tool="line" aria-label="Line" title="Line (L, Shift to snap)" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5"/></svg>
            </button>
            <button class="icon-btn" data-tool="arrow" aria-label="Arrow" title="Arrow (A, Shift to snap)" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5"/><path d="M9 5h10v10"/></svg>
            </button>
            <button class="icon-btn" data-tool="rect" aria-label="Rectangle" title="Rectangle (R, Shift for square)" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="1.5"/></svg>
            </button>
            <button class="icon-btn" data-tool="ellipse" aria-label="Ellipse" title="Ellipse (O, Shift for circle)" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="12" cy="12" rx="9" ry="7"/></svg>
            </button>
            <div class="divider"></div>
            <button class="icon-btn" data-tool="text" aria-label="Text" title="Text (T)" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7V4h14v3"/><path d="M12 4v16"/><path d="M9 20h6"/></svg>
            </button>
        </nav>

        <div class="center">
            <!-- ===== Panel ===== -->
            <main id="stage">
                <div id="panel">
                    <canvas id="board"></canvas>
                    <canvas id="overlay"></canvas> <!-- Live previews for lines/shapes -->
                    <textarea id="textEditor" wrap="off" spellcheck="false" aria-label="Text" hidden></textarea>
                </div>
            </main>

            <!-- ===== Captions for the current panel ===== -->
            <section id="captions" class="storyboard-only" aria-label="Panel captions">
                <div class="panel-badge" id="panelBadge" title="Panel number">1</div>
                <textarea data-caption="action" placeholder="Action" aria-label="Action"></textarea>
                <textarea data-caption="dialogue" placeholder="Dialogue" aria-label="Dialogue"></textarea>
                <textarea data-caption="notes" placeholder="Camera / notes" aria-label="Camera and notes"></textarea>
            </section>
        </div>
    </div>

    <!-- ===== Filmstrip ===== -->
    <footer class="filmstrip storyboard-only" aria-label="Panels">
        <div class="thumbs" id="thumbs"></div>
        <div class="group">
            <button class="icon-btn" id="movePanelLeftBtn" aria-label="Move panel left" title="Move panel left">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
            </button>
            <button class="icon-btn" id="movePanelRightBtn" aria-label="Move panel right" title="Move panel right">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
            </button>
            <button class="icon-btn" id="duplicatePanelBtn" aria-label="Duplicate panel" title="Duplicate panel">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V6a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/></svg>
            </button>
            <button class="icon-btn" id="deletePanelBtn" aria-label="Delete panel" title="Delete panel">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="m19 6-1 14H6L5 6"/></svg>
            </button>
            <button class="pill-btn accent" id="addPanelBtn" title="New panel (N)">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
                Panel
            </button>
        </div>
    </footer>

    <!-- ===== Popovers ===== -->
    <div class="popover" id="colorPopover" hidden>
        <div class="swatches" id="swatches"></div>
        <label class="custom-color">
            <span class="swatch custom" id="customSwatch"></span>
            Custom
            <input type="color" id="customColor" value="#1971c2">
        </label>
    </div>

    <!-- Items are generated from STABILIZER_LEVELS in script.js -->
    <div class="popover menu" id="stabilizerPopover" role="group" aria-label="Stabilizer strength" hidden></div>

    <!-- Items are generated from CANVAS_SIZES in script.js -->
    <div class="popover menu" id="canvasSizePopover" role="group" aria-label="Canvas size" hidden></div>

    <div class="popover menu" id="exportPopover" hidden>
        <div class="menu-heading">Background</div>
        <div class="segmented export-theme" role="group" aria-label="Export background">
            <button class="seg-btn" data-export-theme="light" aria-pressed="true">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
                Light
            </button>
            <button class="seg-btn" data-export-theme="dark" aria-pressed="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
                Dark
            </button>
        </div>
        <div class="menu-heading">Export</div>
        <button class="menu-item storyboard-only" id="exportPanelBtn">Current panel (PNG)</button>
        <button class="menu-item storyboard-only" id="exportSheetBtn">Storyboard sheet (PNG)</button>
        <button class="menu-item whiteboard-only" id="exportBoardBtn">Whiteboard (PNG)</button>
    </div>

    <div id="eraserCursor"></div> <!-- Circle showing the eraser's size -->
    <div id="toast" role="status" aria-live="polite"></div>

    <script src="script.js"></script>
</body>
</html>
